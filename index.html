
<!doctype html>
<html lang="en">
    <!-- This template allows you to create a SIMPLE 6DOF webXR enviroment with a single .glb file and a equirectanglar image for the sky. By gregory vershbow, made with resources from three.js a-frame.io and silverslade -->
    <!-- If exporting from blender be sure to merge all animation tracks -->
    <!-- Creative Commons -->

    <head>
        <title>WebXR Application</title>
        <link rel="icon" type="image/png" href="favicon.ico" />
        <meta name="description" content="3D Application">
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
        <script src="https://unpkg.com/aframe-mirror-component/dist/aframe-mirror-component.min.js"></script>
         <script>
            /* Grip either controller near a named mesh to pick it up. Release to leave it there. */
            AFRAME.registerComponent('vr-pickup', {
                schema: {
                    names: {type: 'array'},
                    distance: {default: 0.4}
                },

                init: function () {
                    this.parts = [];
                    this.held = null;
                    this.heldBy = null;
                    this.handPos = new THREE.Vector3();
                    this.box = new THREE.Box3();
                    this.onModelLoaded = this.onModelLoaded.bind(this);
                    this.tryGrab = this.tryGrab.bind(this);
                    this.release = this.release.bind(this);
                    this.el.addEventListener('model-loaded', this.onModelLoaded);
                },

                onModelLoaded: function () {
                    var names = this.data.names;
                    var root = this.el.getObject3D('mesh');
                    var self = this;
                    if (!root || !names.length) { return; }
                    root.traverse(function (node) {
                        if (self.nameMatches(node.name, names)) { self.parts.push(node); }
                    });
                    if (!this.parts.length) {
                        console.warn('vr-pickup: model has no objects named ' + names.join(', '));
                        return;
                    }
                    var hands = this.el.sceneEl.querySelectorAll('[hand-controls]');
                    for (var i = 0; i < hands.length; i++) {
                        hands[i].addEventListener('gripdown', this.tryGrab);
                        hands[i].addEventListener('gripup', this.release);
                    }
                },

                nameMatches: function (nodeName, names) {
                    if (!nodeName) { return false; }
                    var value = nodeName.toLowerCase();
                    for (var i = 0; i < names.length; i++) {
                        var wanted = names[i].toLowerCase();
                        if (value === wanted || value.indexOf(wanted + '.') === 0) { return true; }
                    }
                    return false;
                },

                tryGrab: function (evt) {
                    var handEl = evt.currentTarget;
                    if (this.held && this.heldBy === handEl) { return; }
                    handEl.object3D.getWorldPosition(this.handPos);
                    var best = null;
                    var bestDist = this.data.distance;
                    for (var i = 0; i < this.parts.length; i++) {
                        var part = this.parts[i];
                        this.box.setFromObject(part);
                        if (this.box.isEmpty()) { continue; }
                        var dist = this.box.distanceToPoint(this.handPos);
                        if (dist < bestDist) {
                            best = part;
                            bestDist = dist;
                        }
                    }
                    if (!best) { return; }
                    if (this.held) { this.dropHeld(); }
                    var home = best.parent;
                    handEl.object3D.attach(best);
                    this.held = {
                        object: best,
                        home: home,
                        position: best.position.clone(),
                        quaternion: best.quaternion.clone(),
                        scale: best.scale.clone()
                    };
                    this.heldBy = handEl;
                },

                dropHeld: function () {
                    if (!this.held) { return; }
                    this.held.home.attach(this.held.object);
                    this.held = null;
                    this.heldBy = null;
                },

                release: function (evt) {
                    if (!this.held || evt.currentTarget !== this.heldBy) { return; }
                    this.dropHeld();
                },

                tick: function () {
                    if (!this.held) { return; }
                    var obj = this.held.object;
                    obj.position.copy(this.held.position);
                    obj.quaternion.copy(this.held.quaternion);
                    obj.scale.copy(this.held.scale);
                }
            });
        </script>
    </head>

    <body>
        <a-scene inspector="url: https://cdn.jsdelivr.net/gh/c-frame/aframe-editor@1.7.x/dist/aframe-editor.min.js">
            <!-- Assets: the src for "MainMesh" and "sky" can be updated with your own files -->
            <a-assets>
                <a-asset-item id="MainMesh" src="./assets/Model.glb"></a-asset-item>
                <a-asset-item id="navmesh" src="./assets/Nav.glb"></a-asset-item>
                <img id="sky" src="./assets/sky.jpg">
                <img id="icon-play" src="./resources/play.png">
                <img id="icon-pause" src="./resources/pause.png">
                <img id="icon-play-skip-back" src="./resources/play-skip-back.png">
                <img id="icon-mute" src="./resources/mute.png">
                <img id="icon-volume-low" src="./resources/volume-low.png">
                <img id="icon-volume-high" src="./resources/volume-high.png">
            </a-assets>

            <!-- Entities -->
            <a-entity id="MainMeshEntity"
                animation-mixer="clip: *; loop: forever; clampWhenFinished: true;"
                gltf-model="#MainMesh"
                scale="1 1 1"
                position="0 0 0"
                visible="true"
                shadow="cast: true"
                geometry=""
                cube-env-map="path: ./env/g_cube/; extension: jpg; reflectivity: 0.99;"
                vr-pickup="names: impossible_cube, impossible_prism">
            </a-entity>

            <a-entity id="Navmesh" nav-mesh gltf-model="#navmesh" visible="false"></a-entity>

            <!-- Camera AKA PLAYER -->
            <a-entity id="player"
                movement-controls="constrainToNavMesh: true;"
                navigator="cameraRig: #cameraRig; cameraHead: #head; collisionEntities: .collision; ignoreEntities: .clickable"
                position="0 0 0"
                rotation="0 0 0">
                <a-entity id="head" camera="active: true" position="0 1 0" look-controls="pointerLockEnabled: true; reverseMouseDrag: true"></a-entity>
                <a-entity id="leftHand"
                    hand-controls="hand: left; handModelStyle: lowPoly; color: #15ACCF"
                    teleport-controls="cameraRig: #cameraRig; teleportOrigin: #head; button: trigger; curveShootingSpeed: 18; landingMaxAngle: 60"
                    visible="true">
                </a-entity>
                <a-entity id="rightHand"
                    hand-controls="hand: right; handModelStyle: lowPoly; color: #15ACCF"
                    laser-controls
                    raycaster="showLine: true; far: 10; interval: 0; objects: .clickable, a-link;"
                    line="color: #7cfc00; opacity: 0.5"
                    visible="true">
                </a-entity>
            </a-entity>

            <!-- Lights -->
            <a-entity light="intensity: 1.0; castShadow: true; shadowBias: -0.001; shadowCameraFar: 501.02; shadowCameraBottom: 12; shadowCameraFov: 101.79; shadowCameraNear: 0; shadowCameraTop: -5; shadowCameraRight: 10; shadowCameraLeft: -10; shadowRadius: 2" position="1.36586 7.17965 1"></a-entity>
            <a-entity light="type: ambient; intensity: 1.0"></a-entity>

            <!-- Sky -->
            <a-sky src="#sky" material="" geometry="" rotation="0 90 0"></a-sky>
        </a-scene>
    </body>
</html>
